name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks on ${{ matrix.os }} (Node 24)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run format:check
      - name: Test scoped GitHub integration transport
        run: node --test test/github-fetch.test.js
      - run: npm pack --dry-run

  integration:
    name: Real LuaLS and Lumine integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LUMINE_JASMINE_REPORTER: list
      LUMINE_TEST_PACKAGES: ide language-lua
      LUALS_VERSION: 3.19.2
      REQUIRE_LUALS: 1
    steps:
      - uses: actions/checkout@v7
        with:
          path: ide-luals
      - uses: actions/checkout@v7
        with:
          repository: lumine-code/lumine
          path: lumine
      - uses: actions/checkout@v7
        with:
          repository: lumine-code/ide
          path: ide
      - uses: actions/checkout@v7
        with:
          repository: lumine-code/language-lua
          path: language-lua
      - uses: actions/setup-node@v7
        with:
          node-version-file: lumine/.nvmrc
          cache: npm
          cache-dependency-path: lumine/package-lock.json
      - name: Install the exact checksum-verified official LuaLS release
        run: |
          mkdir "$GITHUB_WORKSPACE/luals"
          curl --fail --location --retry 3 --output luals.tar.gz https://github.com/LuaLS/lua-language-server/releases/download/3.19.2/lua-language-server-3.19.2-linux-x64.tar.gz
          echo "93ad326b10f6c00911dd8c450fa098332dbd8f9f45d1052f5636a2d54479b947  luals.tar.gz" | sha256sum --check
          tar -xzf luals.tar.gz -C "$GITHUB_WORKSPACE/luals"
          chmod +x "$GITHUB_WORKSPACE/luals/bin/lua-language-server"
          echo "LUALS_PATH=$GITHUB_WORKSPACE/luals/bin/lua-language-server" >> "$GITHUB_ENV"
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y xvfb libx11-dev libxkbfile-dev libsecret-1-dev
      - name: Use HTTPS for public Git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install adapter dependencies
        working-directory: ide-luals
        run: npm ci --ignore-scripts
      - name: Install client dependencies
        working-directory: ide
        run: npm ci --ignore-scripts
      - name: Install editor dependencies
        working-directory: lumine
        run: |
          install() { npm ci --ignore-scripts; }
          install || install || install
      - name: Prepare Electron
        working-directory: lumine
        run: |
          node script/install-electron.js
          npm run build
      - name: Link editor service packages
        run: |
          echo "LUMINE_HOME=$GITHUB_WORKSPACE/.test-home" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/.test-home/packages"
          ln -s "$GITHUB_WORKSPACE/ide" "$GITHUB_WORKSPACE/.test-home/packages/ide"
          ln -s "$GITHUB_WORKSPACE/language-lua" "$GITHUB_WORKSPACE/.test-home/packages/language-lua"
      - name: Run Jasmine specs against the real editor and server
        working-directory: lumine
        timeout-minutes: 20
        env:
          LUMINE_TEST_GITHUB_TOKEN: ${{ github.token }}
        run: xvfb-run --auto-servernum npm start -- --dev --test ../ide-luals/spec
